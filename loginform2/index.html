<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginForm-2</title>
    <!-- css link  -->
    <link rel="stylesheet" href="style.css">
    <!-- link font awesome  -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="container">
        <h3 class="heading">Login</h3>
        <div class="input-box">
            <input type="text" placeholder="Username" class="user" >
            <i class="fa-solid fa-user face"></i>
        </div>
        <div class="input-box">
        <input type="text" placeholder="Passward" class="user" >
        <i class="fa-solid fa-lock lock"></i>
        </div>
        <div class="detail">
            <div class="chek-box">
             <input type="checkbox" id="chek">
             <label for="chek" class="checkbox">Remember me</label>
            </div>
            <a href="#" class="forgot">Forgot Passward</a>
        </div>
        <button class="button">Login</button>
        <span class="about">Don't have an account? <a href="#">Register</a> </span>
    </div>
</body>
</html>
