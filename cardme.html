<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Tutoriyal</title>
    <!-- Css -->
    <link rel="stylesheet" href="cardme.css">

    <!-- Boxicons Css  -->
     <link href='https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css' rel='stylesheet'>
     <link href='https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css' rel='stylesheet'>
     <link href='https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css' rel='stylesheet'>
 
</head>
<body>
    <div class="profile-card">
        <div class="image">
            <img src="lokeshimg.jpg" alt="myimg" class="profile-img">
        </div>

        <div class="text-data">
            <span class="name">Lokesh</span>
            <span class="job">Youtuber & Developer</span>
        </div>

        <div class="media-button">

            <a href="#" style="background: #4267b2;" class="link">
                <i class="bxl bx-facebook"></i>
            </a>

            <a href="#" style="background: #1da1f2;" class="link">
                <i class="bxl bx-twitter"></i>
            </a>

            <a href="#" style = "background: #e1306c;" class="link">
                <i class="bxl bx-instagram"></i>
            </a>

            <a href="#" style="background: #ff0000;" class="link">
                <i class="bxl bx-youtube"></i>
            </a>
        </div>

        <div class="buttons">
            <button class="button">Subscribe</button>
            <button class="button">Message</button>
        </div>

        <div class="analytics">
            <div class="data">
                <i class="bx bx-heart"></i>
                <span class="number">60k</span>
            </div>

            <div class="data">
                <i class="bx bx-message-circle"></i>
                <span class="number">20k</span>
            </div>

            <div class="data">
                <i class="bx bx-arrow-up-left-stroke"></i>
                <span class="number">12k</span>
            </div>
        </div>
    </div>
</body>
</html>
